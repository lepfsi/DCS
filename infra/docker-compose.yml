version: "3.9"
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: dcs
      POSTGRES_USER: dcs
      POSTGRES_PASSWORD: dcs
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  s3:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dcs
      MINIO_ROOT_PASSWORD: dcs123
    ports: ["9000:9000", "9001:9001"]
    volumes: [s3data:/data]
volumes:
  pgdata:
  s3data:
